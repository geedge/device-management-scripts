- hosts: all
  roles:
    - jdk1.8.0_73

- hosts: blade-mxn
  roles:
    - consul-external
    - tsg-cli-mxn
    - oam_cli_agent_mxn
    - oam_cli
    - oam_core
    - oam_snmp
    - ipython

- hosts: blade-mcn0
  roles:
    #- consul-internal_mcn01
    - telegraf
    - influxdb
    - grafana
    - tsg-cli-mcn0
    #- mariadb
    - oam_cli_agent

- hosts: blade-mcn1
  roles:
    #- consul-internal_mcn01
    - tsg-cli-mcn1
    - oam_cli_agent

- hosts: blade-mcn2
  roles:
    #- consul-internal_mcn23
    - tsg-cli-mcn2
    - oam_cli_agent

- hosts: blade-mcn3
  roles:
    #- consul-internal_mcn23
    - tsg-cli-mcn3
    - oam_cli_agent

- hosts: blade-mxn
  roles:
    - oam_mxn_start

- hosts: cluster_server
  roles:
    - oam_cluster
    - consul-cluster
    # mariadb复用毕方
    #- mariadb
    - influxdb
    - ha_master
    
- hosts: cluster_server_backup
  roles:
    - oam_cluster
    - consul-cluster-backup
    # mariadb复用毕方
    #- mariadb
    - influxdb    
    - ha_backup