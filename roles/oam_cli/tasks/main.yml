- name: "copy oam_cli.rpm to destination server"
  copy:
    src: "{{ role_path }}/files/"
    dest: /tmp

- name: "install oam_cli"
  yum:
    name:
      - /tmp/oam_cli-1.0-1.0.x86_64.rpm
    state: present

- name: "Templates application.properties"
  template:
    src: "{{role_path}}/templates/application.properties.j2"
    dest: /home/tsgroot/opt/tsg/cli/application.properties
  tags: template

- name: "copy oam_cli.service to destination server"
  copy:
    src: "{{ role_path }}/files/oam_cli.service"
    dest: /usr/lib/systemd/system/oam_cli.service

- name: "restart oam_cli service"
  systemd:
    daemon_reload: yes
    name: oam_cli
    state: restarted    