- name: "copy rsyslog.conf to destination server"
  synchronize:
    src: "{{ role_path }}/files/rsyslog.conf"
    dest: "/etc/"    

- name: "restart rsyslog service"
  systemd:
    name: rsyslog
    state: restarted

 
- name: "enable tsg_cluster_register.service"
  systemd:
    name: tsg_cluster_register
    enabled: yes
    daemon_reload: yes
    state: restarted   
