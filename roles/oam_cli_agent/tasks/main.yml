
- name: "Templates oam_cli_agent.service"
  template:
    src: "{{ role_path }}/templates/oam_cli_agent.service.j2"
    dest: /usr/lib/systemd/system/oam_cli_agent.service

- name: "Start oam_cli_agent"
  systemd:
    name: oam_cli_agent
    state: restarted
    enabled: yes
    daemon_reload: yes
