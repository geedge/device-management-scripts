- name: "copy oam_snmp.rpm to destination server"
  copy:
    src: "{{ role_path }}/files/"
    dest: /tmp

- name: "install oam_snmp"
  yum:
    name:
      - /tmp/oam_snmp-1.0-1.0.x86_64.rpm
    state: present

- name: "Templates application.properties"
  template:
    src: "{{role_path}}/templates/application.properties.j2"
    dest: /opt/tsg/snmp/application.properties
  tags: template

- name: "Templates oam_snmp.service"
  template:
    src: "{{ role_path }}/templates/oam_snmp.service.j2"
    dest: /usr/lib/systemd/system/oam_snmp.service

- name: "mkdir /etc/snmp"
  file:
    path: /etc/snmp
    state: directory

- name: "Templates snmpd.conf"
  template:
    src: "{{role_path}}/templates/snmpd.conf"
    dest: /etc/snmp/snmpd.conf
  tags: template
