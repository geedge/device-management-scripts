- hosts: all
  roles:
    - jdk1.8.0_73

- hosts: blade-mxn
  roles:
    - consul-client
    - tsg-cli-mxn
    - oam_cli_agent_mxn
    - oam_cli
    - oam_core
    - oam_snmp

- hosts: blade-mcn0
  roles:
    - telegraf
    - influxdb
    - grafana
    - tsg-cli-mcn0
    - setup_mariadb
    - oam_cli_agent

- hosts: blade-mcn1
  roles:
    - tsg-cli-mcn1
    - oam_cli_agent

- hosts: blade-mcn2
  roles:
    - tsg-cli-mcn2
    - oam_cli_agent

- hosts: blade-mcn3
  roles:
    - tsg-cli-mcn3
    - oam_cli_agent

- hosts: blade-mxn
  roles:
    - oam_mxn_start

