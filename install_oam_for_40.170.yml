---
- hosts: sled-mxn
  gather_facts: no
  roles:
    - tsg-cli-mxn
    - oam_cli_agent_mxn
    - oam_cli
    - oam_core
    - oam_snmp
    
- hosts: sled-mcn0
  gather_facts: no
  roles:
    - tsg-cli-mcn0
    - oam_cli_agent

- hosts: sled-mcn1 
  gather_facts: no
  roles:
    - tsg-cli-mcn1
    - oam_cli_agent

- hosts: sled-mcn2
  gather_facts: no
  roles:
    - tsg-cli-mcn2
    - oam_cli_agent

- hosts: sled-mcn3  
  gather_facts: no
  roles:
    - tsg-cli-mcn3
    - oam_cli_agent

- hosts: sled-mxn
  gather_facts: no
  roles:
    - oam_core_start

## initialize is after all module has been installed
- hosts: sled-mcn0
  gather_facts: no
  roles:
    - oam_env_initialize
